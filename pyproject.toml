[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-rights-rag"
version = "0.1.0"
description = "打工權益問答與勞動裁罰紀錄檢索專題"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.51,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
rerank = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

